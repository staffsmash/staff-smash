<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b2a4a" />
    <meta name="description" content="Staff Smash: HUFS — 1인칭 시험판 (본관 앞)" />
    <title>Staff Smash: HUFS 1인칭 시험판 (비공식)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b2a4a;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        color: #fff;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      .hud {
        position: fixed;
        pointer-events: none;
        text-shadow: 0 2px 3px #111318, 0 0 2px #111318;
      }
      #topleft {
        left: 14px;
        top: 12px;
        background: rgba(11, 13, 18, 0.55);
        border-radius: 6px;
        padding: 8px 12px 10px;
        min-width: 220px;
        text-shadow: none;
      }
      #topleft .name {
        font-size: 13px;
      }
      #hp {
        margin-top: 6px;
        height: 12px;
        background: #3a1f24;
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      #hpbar {
        height: 100%;
        width: 100%;
        background: #5bd16b;
      }
      #wave {
        margin-top: 6px;
        font-size: 12px;
        color: #9fd3ff;
      }
      #clock {
        left: 50%;
        top: 10px;
        transform: translateX(-50%);
        font-size: 18px;
        font-weight: 700;
        white-space: nowrap;
        text-align: center;
      }
      #clock small {
        display: block;
        font-size: 12px;
        font-weight: 400;
        color: #dfe6f2;
      }
      #cross {
        left: 50%;
        top: 50%;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        border: 2px solid #ff5a5a;
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
      }
      #cross::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        background: #ff5a5a;
        border-radius: 50%;
      }
      #banner {
        left: 50%;
        top: 30%;
        transform: translateX(-50%);
        font-size: 30px;
        font-weight: 700;
        text-align: center;
        opacity: 0;
        transition: opacity 0.25s;
        white-space: nowrap;
      }
      #banner small {
        display: block;
        font-size: 15px;
        font-weight: 400;
        margin-top: 4px;
      }
      #note {
        left: 50%;
        top: 62%;
        transform: translateX(-50%);
        font-size: 16px;
        font-weight: 700;
        color: #9fd3ff;
        opacity: 0;
        transition: opacity 0.2s;
      }
      #vignette {
        inset: 0;
        box-shadow: inset 0 0 160px 40px rgba(208, 32, 47, 0.75);
        opacity: 0;
        transition: opacity 0.15s;
      }
      #help {
        right: 12px;
        bottom: 12px;
        background: rgba(11, 13, 18, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 12px;
        line-height: 1.6;
        text-shadow: none;
      }
      #help b {
        color: #f5c542;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(11, 42, 74, 0.82);
        z-index: 5;
      }
      #overlay[hidden] {
        display: none;
      }
      .panel {
        text-align: center;
        max-width: 560px;
        padding: 24px;
      }
      .panel img.emblem {
        width: 64px;
        vertical-align: middle;
      }
      .panel img.type {
        height: 40px;
        vertical-align: middle;
        margin-left: 6px;
      }
      .panel h1 {
        margin: 8px 0 4px;
        font-size: 34px;
      }
      .panel h1 .tag {
        display: inline-block;
        font-size: 14px;
        background: #d0202f;
        padding: 2px 8px;
        transform: rotate(-6deg);
        vertical-align: middle;
        margin-left: 6px;
      }
      .panel p {
        color: #dfe6f2;
        line-height: 1.6;
        margin: 8px 0;
      }
      .panel .big {
        font-size: 22px;
        font-weight: 700;
        color: #f5c542;
      }
      .panel button,
      .panel a.btn {
        display: inline-block;
        margin: 12px 6px 0;
        padding: 12px 22px;
        font: 700 17px 'Malgun Gothic', sans-serif;
        color: #fff;
        background: #2f8f4e;
        border: 2px solid #111318;
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
      }
      .panel a.btn {
        background: #2f6fd1;
      }
      #touch {
        display: none;
      }
      body.touch #touch {
        display: block;
      }
      body.touch #help {
        display: none;
      }
      #stick {
        position: fixed;
        left: 40px;
        bottom: 40px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid rgba(255, 255, 255, 0.35);
        pointer-events: none;
      }
      #knob {
        position: absolute;
        left: 35px;
        top: 35px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.45);
      }
      #fire {
        position: fixed;
        right: 36px;
        bottom: 44px;
        width: 92px;
        height: 92px;
        border-radius: 50%;
        border: 3px solid #111318;
        background: #d0202f;
        color: #fff;
        font: 700 20px 'Malgun Gothic', sans-serif;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #111318;
        font: 600 20px/1.5 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hud" id="topleft">
      <div class="name">김국제 · 1인칭 시험판</div>
      <div id="hp"><div id="hpbar"></div></div>
      <div id="wave"></div>
    </div>
    <div class="hud" id="clock"></div>
    <div class="hud" id="cross"></div>
    <div class="hud" id="banner"></div>
    <div class="hud" id="note"></div>
    <div class="hud" id="vignette"></div>
    <div class="hud" id="help">
      <b>조작법</b><br />
      이동 WASD · 달리기 Shift · 시점 마우스<br />
      도장 던지기 클릭 · 일시정지 Esc
    </div>
    <div id="touch">
      <div id="stick"><div id="knob"></div></div>
      <button id="fire" type="button">도장</button>
    </div>
    <div id="overlay"></div>
    <div id="rotate">
      <div style="font-size: 56px">📱↻</div>
      <div>가로로 돌려주세요</div>
    </div>
    <script type="module" src="/src/fps/main.ts"></script>
  </body>
</html>
