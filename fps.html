<!doctype html>

    <meta name="description" content="Staff Smash: HUFS — 1인칭 시험판 (본관 앞 → 사회과학관 앞 → 대운동장 → 해 질 녘 본관 앞)" />
    <title>Staff Smash: HUFS 1인칭 시험판 (비공식)</title>
    <style>
      html,
      body {

        height: 100%;
        background: #0b2a4a;
        overflow: hidden;
        touch-action: none;

      }

        text-shadow: none;
      }
      #topleft .name {
        font-size: 13px;
      }
      #hp,

      #wave {

        font-size: 12px;
        color: #dfe6f2;
      }
      #bossbox .bweak {
        display: none;
        margin-left: 8px;
        font-size: 12px;
        color: #ffe066;
      }
      #bossbox.weak .bweak {
        display: inline;
      }
      #bosshp {
        margin-top: 3px;
        height: 12px;
        background: #1d2a3d;
        border: 1px solid rgba(255, 255, 255, 0.6);

      #bossbar {

      /* 사람 보스의 지금 대사: 보스 막대 아래 자막 한 줄 "이름: 대사" (speech.ts) */
      #subtitle {
        left: 50%;
        top: 104px;
        transform: translateX(-50%);
        max-width: min(92vw, 860px);
        box-sizing: border-box;
        padding: 4px 16px 5px;
        border-radius: 8px;
        background: rgba(11, 13, 18, 0.8);
        font-size: 24px;
        font-weight: 700;
        line-height: 1.3;
        color: #fff;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: none;
        opacity: 0;
        transition: opacity 0.15s;
      }
      #subtitle.on {
        opacity: 1;
      }
      /* 구역 정리 카드가 떠 있는 동안은 자막을 숨긴다 (말풍선은 그대로) */
      #areacard.on ~ #subtitle {
        opacity: 0;
      }
      #subtitle b {
        font-weight: 800;
      }
      #cross {
        left: 50%;
        top: 50%;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        border: 2px solid #ff5a5a;
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
      }
      #cross::after {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        background: #ff5a5a;
        border-radius: 50%;
      }
      #hitmark {
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
        opacity: 0;
      }
      #hitmark i {
        position: absolute;
        left: -1.5px;
        top: -5px;
        width: 3px;
        height: 10px;
        background: #fff;
        box-shadow: 0 0 2px #111318;
      }
      #hitmark i:nth-child(1) {
        transform: rotate(45deg) translateY(-17px);
      }
      #hitmark i:nth-child(2) {
        transform: rotate(135deg) translateY(-17px);
      }
      #hitmark i:nth-child(3) {
        transform: rotate(225deg) translateY(-17px);
      }
      #hitmark i:nth-child(4) {
        transform: rotate(315deg) translateY(-17px);
      }
      #hitmark.kill i {
        background: #f5c542;
        height: 13px;
      }
      .dir {
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
        opacity: 0;
      }
      .dir b {
        position: absolute;
        left: -46px;
        top: -170px;
        width: 92px;
        height: 30px;
        border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        border-top: 5px solid #ff4d4d;
        background: radial-gradient(ellipse at 50% 0%, rgba(255, 60, 60, 0.55), rgba(255, 60, 60, 0) 70%);
      }
      #guide b {
        left: -16px;
        top: -132px;
        width: 0;
        height: 0;
        border-radius: 0;
        background: none;
        border-top: 0;
        border-left: 16px solid transparent;
        border-right: 16px solid transparent;
        border-bottom: 26px solid #f5c542;
        filter: drop-shadow(0 0 2px #111318);
      }
      #banner {
        left: 50%;
        top: 30%;
        transform: translateX(-50%);
        padding: 2px 18px 5px;
        border-radius: 10px;
        background: rgba(11, 13, 18, 0.55);
        font-size: 30px;
        font-weight: 700;
        text-align: center;
        opacity: 0;
        transition: opacity 0.25s;
        white-space: nowrap;
      }
      #banner small {
        display: block;
        font-size: 15px;
        font-weight: 400;
        margin-top: 4px;
      }
      #note {
        left: 50%;
        top: 62%;
        transform: translateX(-50%);
        font-size: 16px;
        font-weight: 700;
        color: #9fd3ff;
        opacity: 0;
        transition: opacity 0.2s;
        white-space: nowrap;
      }
      #jumpcue {
        left: 50%;
        top: calc(50% + 34px);
        transform: translateX(-50%);
        padding: 3px 14px 4px;
        border: 2px solid #ffd84a;
        border-radius: 999px;
        background: rgba(17, 19, 24, 0.78);
        font-size: 20px;
        font-weight: 800;
        color: #ffd84a;
        white-space: nowrap;
        text-shadow: none;
        opacity: 0;
      }
      #jumpcue small {
        margin-left: 6px;
        font-size: 13px;
        color: #fff;
      }
      body.touch #jumpcue small {
        display: none;
      }
      #jumpcue.on {
        opacity: 1;
        animation: blink 0.24s steps(2) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.6;
        }
      }
      #areacard {
        left: 50%;
        top: max(64px, 12%);
        transform: translate(-50%, -10px);
        width: min(92vw, 460px);
        box-sizing: border-box;
        background: rgba(0, 44, 82, 0.9);
        border: 2px solid #e0bb62;
        border-radius: 8px;
        padding: 10px 14px 12px;
        text-align: center;
        text-shadow: none;
        opacity: 0;
        transition:
          opacity 0.3s,
          transform 0.3s;
      }
      #areacard.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #areacard small {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: #e0bb62;
        letter-spacing: 1px;
      }
      #areacard b {
        display: block;
        font-size: 22px;
        margin: 2px 0 6px;
      }
      #areacard .stats {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 4px 14px;
        font-size: 13px;
        color: #dfe6f2;
      }
      #areacard em,
      .result .areas em {
        font-style: normal;
        font-weight: 700;
        color: #f5c542;
      }
      #areacard .next {
        margin-top: 6px;
        font-size: 13px;
        font-weight: 700;
        color: #9fd3ff;
      }
      .bigstamp {
        top: 32%;
        width: 0;
        height: 0;
        opacity: 0;
        z-index: 3;
      }
      #stamp1 {
        left: 31%;
      }
      #stamp2 {
        left: 69%;
        top: 44%;
      }
      .bigstamp .inner {
        position: absolute;
        --w: min(40vw, 340px);
        width: var(--w);
        height: calc(var(--w) * 0.3);
        left: calc(var(--w) / -2);
        top: calc(var(--w) * -0.15);
        box-sizing: border-box;
        border: 7px solid currentColor;
        border-radius: 14px;
        background: rgba(255, 250, 238, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: calc(var(--w) * 0.15);
        font-weight: 900;
        text-shadow: none;
        white-space: nowrap;
      }
      .bigstamp .inner::after {
        content: '';
        position: absolute;
        inset: 6px;
        border: 3px solid currentColor;
        border-radius: 9px;
      }
      #stamp1 .inner {
        color: #d0202f;
        transform: rotate(-7deg);
      }
      #stamp2 .inner {
        color: #1d4ed8;
        transform: rotate(6deg);
      }
      .bigstamp.on {
        opacity: 1;
        animation: slam 0.32s cubic-bezier(0.2, 1.4, 0.4, 1) both;
      }
      #fade {
        inset: 0;
        background: #0b0d12;
        opacity: 0;
        z-index: 4;
        transition: opacity 0.7s;
      }
      #fade.on {
        opacity: 1;
      }
      @keyframes slam {
        0% {
          transform: scale(2.6);
          opacity: 0;
        }
        60% {
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      #vignette {
        inset: 0;
        box-shadow: inset 0 0 160px 40px rgba(208, 32, 47, 0.75);
        opacity: 0;
        transition: opacity 0.15s;
      }
      #flash {
        inset: 0;
        background: #fff6d8;
        opacity: 0;
      }
      #help {
        right: 12px;
        bottom: 12px;
        background: rgba(11, 13, 18, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 12px;
        line-height: 1.6;
        text-shadow: none;
      }
      #help b {
        color: #f5c542;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: safe center;
        justify-content: center;
        background: rgba(11, 42, 74, 0.82);
        z-index: 5;
        overflow-y: auto;
      }
      #overlay[hidden] {
        display: none;
      }
      .panel {
        text-align: center;
        max-width: 600px;
        padding: 24px;
      }
      .panel img.emblem {
        width: 64px;
        vertical-align: middle;
      }
      .panel img.type {
        height: 40px;
        vertical-align: middle;
        margin-left: 6px;
      }
      .panel h1 {
        margin: 8px 0 4px;

      }
      .panel h1 .tag {
        display: inline-block;
        font-size: 14px;
        background: #d0202f;
        padding: 2px 8px;
        transform: rotate(-6deg);

        margin-left: 6px;
      }
      .panel p {
        color: #dfe6f2;
        line-height: 1.6;
        margin: 8px 0;
      }
      .panel .big {
        font-size: 22px;
        font-weight: 700;
        color: #f5c542;
      }
      .panel button,
      .panel a.btn {
        display: inline-block;
        margin: 12px 6px 0;
        padding: 12px 22px;
        font: 700 17px 'Malgun Gothic', sans-serif;
        color: #fff;
        background: #2f8f4e;
        border: 2px solid #111318;
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
      }
      .panel a.btn {
        background: #2f6fd1;
      }
      .panel button.ghost {
        background: #4a5568;
      }
      .panel .ctl {
        font-size: 13px;
        color: #c9d3e3;
      }
      .panel .foot {
        font-size: 12px;
        color: #8b95a8;
      }
      .panel .best {
        font-size: 13px;
        color: #c9d3e3;
      }
      .panel .best span {
        display: inline-block;
        margin: 0 6px;
      }
      .panel .best span.cur {
        color: #f5c542;
      }
      .panel .best b {
        color: #fff;
      }
      .panel .newbest {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 4px;
        background: #d0202f;
        color: #fff;
        font-weight: 700;
      }
      .settings {
        max-width: 470px;
        margin: 6px auto 4px;
        text-align: left;
      }
      .srow {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px 10px;
        margin: 8px 0;
      }
      .srow.center {
        justify-content: center;
      }
      .slabel {
        min-width: 160px;
        font-weight: 700;
        font-size: 15px;
      }
      .srow.center .slabel {
        min-width: 0;
      }
      .srow input[type='range'] {
        flex: 1;
        min-width: 140px;
        height: 30px;

      }
      .srow output {
        min-width: 48px;

        font-weight: 700;
        color: #f5c542;
      }
      .srow input[type='checkbox'] {
        width: 26px;
        height: 26px;
        margin: 0;
        accent-color: #f5c542;
      }
      .shint,
      .snote {
        font-size: 12px;
        color: #9fb0c8;
      }
      .shint {
        flex-basis: 100%;
      }
      .snote {
        margin: -4px 0 6px;
      }
      .seg {
        display: inline-flex;
        border: 2px solid #111318;
        border-radius: 6px;
        overflow: hidden;
      }
      .panel .seg button {
        margin: 0;
        padding: 9px 16px;
        border: 0;
        border-radius: 0;
        background: #33465e;
        color: #dfe6f2;
        font: 700 15px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      }
      .panel .seg button + button {
        border-left: 2px solid #111318;
      }
      .panel .seg button.on {
        background: #f5c542;
        color: #111318;
      }
      .result .areas span {
        display: inline-block;
        margin: 0 8px;
        font-size: 14px;
      }
      .panel img.emblem.inline {
        width: 40px;
        vertical-align: -8px;
      }
      .result .sheet {
        display: flex;
        gap: 18px;
        align-items: center;
        justify-content: center;
        margin: 8px 0;
      }
      .result .grade {
        flex: none;
        width: 104px;
        height: 104px;
        border-radius: 50%;
        background: #f5c542;
        color: #111318;
        font-size: 64px;
        font-weight: 800;
        line-height: 104px;
        border: 3px solid #111318;
        position: relative;
      }
      .result .grade small {
        position: absolute;
        left: 0;
        right: 0;
        top: 10px;
        font-size: 11px;

      .result .grade.g-C,
      .result .grade.g-D {

      .result td.pts {
        text-align: right;

      }
      .result .counts {
        font-size: 13px;
      }
      /* 닉네임 기록판 (src/fps/board.ts): 결과 화면의 입력 칸과 기록판 창 */
      .frec {
        max-width: 470px;
        margin: 10px auto 0;
      }
      .frec-row {
        display: flex;
        justify-content: center;
        gap: 8px;
      }

        flex: 1 1 auto;
        min-width: 0;

        padding: 8px 10px;

        align-items: center;
        justify-content: center;

          calc(8px + env(safe-area-inset-left));

      }

        min-height: 60px;
        overflow-y: auto;
        touch-action: pan-y;
        -webkit-overflow-scrolling: touch;
      }
      #fboard table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      #fboard th {
        position: sticky;
        top: 0;
        padding: 4px 6px;
        background: #1d2433;
        border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        font-size: 12px;
        color: #9fb0c8;
        white-space: nowrap;
      }
      #fboard td {
        padding: 3px 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        color: #dfe6f2;
        white-space: nowrap;
      }
      #fboard td.r {
        color: #9fb0c8;
      }
      #fboard td.n {
        text-align: left;
        font-weight: 700;
        color: #fff;
      }
      #fboard td.res.ok {
        color: #7cfc9a;
        font-weight: 700;
      }
      #fboard tbody tr:nth-child(-n + 3) td.r {
        color: #f5c542;
        font-weight: 800;
      }
      #fboard tr.me td {
        background: rgba(245, 197, 66, 0.28);
        color: #ffe066;
      }
      #fboard .fb-empty {
        margin: 24px 0;
        font-size: 15px;
        color: #dfe6f2;
      }
      #fboard .fb-close {
        align-self: center;
        margin-top: 10px;
        padding: 9px 28px;
        border: 2px solid #111318;
        border-radius: 4px;
        background: #4a5568;
        font-size: 15px;
      }
      @media (max-height: 500px) {
        .frec {
          margin-top: 6px;
        }
        .frec input {
          padding: 5px 8px;
          font-size: 16px;
        }
        .panel .frec button {
          padding: 6px 12px;
          font-size: 14px;
        }
        .panel .frec .frec-note {
          font-size: 11px;
        }
        #fboard .fb-box {
          padding: 8px 12px 10px;
        }
        #fboard h2 {
          font-size: 18px;
        }
        #fboard .fb-tabs button {
          padding: 4px 14px;
        }
        #fboard .fb-x {
          width: 32px;
          height: 32px;
        }
        #fboard .fb-note {
          margin: 4px 0;
          font-size: 12px;
        }
        #fboard table {
          font-size: 13px;
        }
        #fboard td {
          padding: 2px 6px;
        }
        #fboard .fb-close {
          margin-top: 6px;
          padding: 6px 24px;
        }
      }
      #touch {
        display: none;
      }
      body.touch #touch {
        display: block;
      }
      body.touch #help {
        display: none;
      }
      #stick {
        position: fixed;
        left: calc(40px + env(safe-area-inset-left));
        bottom: calc(40px + env(safe-area-inset-bottom));
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 2px solid rgba(255, 255, 255, 0.35);
        pointer-events: none;
      }
      #knob {
        position: absolute;
        left: 35px;
        top: 35px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.45);
      }
      #touch button {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #fire {
        position: fixed;
        right: calc(26px + env(safe-area-inset-right));
        bottom: calc(30px + env(safe-area-inset-bottom));
        width: 98px;
        height: 98px;
        border-radius: 50%;
        border: 3px solid #111318;
        background: #d0202f;
        color: #fff;
        font: 700 20px 'Malgun Gothic', sans-serif;
      }
      #jumpBtn {
        position: fixed;
        right: calc(140px + env(safe-area-inset-right));
        bottom: calc(22px + env(safe-area-inset-bottom));
        width: 76px;
        height: 76px;
        border-radius: 50%;
        border: 3px solid #111318;
        background: #2f6fd1;
        color: #fff;
        font: 700 16px 'Malgun Gothic', sans-serif;
      }
      #jumpBtn.alert {
        background: #ffd84a;
        color: #111318;
        box-shadow: 0 0 16px #ffd84a;
      }
      #spBtn {
        position: fixed;
        right: calc(42px + env(safe-area-inset-right));
        bottom: calc(142px + env(safe-area-inset-bottom));
        width: 66px;
        height: 66px;
        border-radius: 50%;
        border: 3px solid #111318;
        background: #4a4f5a;
        color: #c9ced8;
        font: 700 14px 'Malgun Gothic', sans-serif;
      }
      #spBtn.ready {
        background: #f5c542;
        color: #111318;
        box-shadow: 0 0 12px #f5c542;
      }
      .mini {
        position: fixed;
        top: calc(12px + env(safe-area-inset-top));
        height: 38px;
        min-width: 44px;
        padding: 0 10px;
        border-radius: 6px;
        border: 2px solid rgba(255, 255, 255, 0.5);
        background: rgba(11, 13, 18, 0.6);
        color: #fff;
        font: 700 13px 'Malgun Gothic', sans-serif;
      }
      #pauseBtn {
        right: calc(12px + env(safe-area-inset-right));
        min-width: 48px;
      }
      #muteBtn {
        right: calc(70px + env(safe-area-inset-right));
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #111318;
        font: 600 20px/1.5 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
      @media (max-height: 500px) {
        .panel {
          padding: 10px 16px;
        }
        .panel img.emblem {
          width: 40px;
        }
        .panel img.type {
          height: 26px;
        }
        .panel h1 {
          font-size: 24px;
          margin: 4px 0 2px;
        }
        .panel p {
          margin: 4px 0;
          line-height: 1.45;
          font-size: 14px;
        }
        .panel .big {
          font-size: 17px;
        }
        .panel button,
        .panel a.btn {
          margin-top: 6px;
          padding: 9px 18px;
          font-size: 15px;
        }
        .result .grade {
          width: 80px;
          height: 80px;
          line-height: 80px;
          font-size: 48px;
        }
        .result .grade small {
          top: 7px;
        }
        .result td {
          padding: 1px 6px;
          font-size: 13px;
        }
        /* 휴대폰 가로: 시계·보스 막대·자막·띠를 위로 붙여 머리 위 말풍선과 조준점 사이를 비운다 */
        #clock {
          top: 4px;
        }
        #bossbox {
          top: 46px;
        }
        #subtitle {
          top: 86px;
          padding: 2px 12px 3px;
          font-size: 18px;
          line-height: 1.25;
        }
        #banner {
          top: 122px;
          font-size: 22px;
        }
        #banner small {
          font-size: 13px;
          margin-top: 2px;
        }
        #topleft {
          min-width: 190px;
          padding: 6px 10px 8px;
        }
        .srow {
          margin: 5px 0;
        }
        .panel .seg button {
          padding: 7px 14px;
        }
        .panel .ctl,
        .panel .best {
          font-size: 12px;
        }
        .panel .foot {
          font-size: 11px;
        }
        .result .sheet {
          margin: 4px 0;
        }
        .result .areas span {
          font-size: 12px;
        }
        #areacard {
          padding: 6px 12px 8px;
        }
        #areacard b {
          font-size: 18px;
          margin: 0 0 4px;
        }
        #fire {
          width: 88px;
          height: 88px;
          bottom: calc(22px + env(safe-area-inset-bottom));
        }
        #jumpBtn {
          right: calc(128px + env(safe-area-inset-right));
          bottom: calc(14px + env(safe-area-inset-bottom));
          width: 70px;
          height: 70px;
        }
        #spBtn {
          bottom: calc(124px + env(safe-area-inset-bottom));
          width: 60px;
          height: 60px;
        }
        #stick {
          bottom: calc(26px + env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hud" id="topleft">
      <div class="name">김국제 · 1인칭 시험판</div>
      <div id="hp"><div id="hpbar"></div></div>
      <div id="sp"><div id="spbar"></div><span id="splabel">전체 공지 발송</span></div>
      <div id="wave"></div>
      <div id="buff"></div>
    </div>
    <div class="hud" id="clock"></div>
    <div class="hud" id="bossbox">
      <div class="bname"><span id="bossname"></span><span id="bossprog">결재 진행 0%</span><span class="bweak">결재판을 들었다!</span></div>
      <div id="bosshp"><div id="bossbar"></div></div>
    </div>
    <div class="hud" id="cross"></div>
    <div class="hud" id="hitmark"><i></i><i></i><i></i><i></i></div>
    <div class="hud dir dmg"><b></b></div>
    <div class="hud dir dmg"><b></b></div>
    <div class="hud dir dmg"><b></b></div>
    <div class="hud dir dmg"><b></b></div>
    <div class="hud dir" id="guide"><b></b></div>
    <div class="hud" id="banner"></div>
    <div class="hud" id="note"></div>
    <div class="hud" id="jumpcue">점프!<small>Space</small></div>
    <div class="hud" id="areacard"></div>
    <div class="hud" id="subtitle" aria-live="polite"></div>
    <div class="hud bigstamp" id="stamp1"><div class="inner">퇴근 승인</div></div>
    <div class="hud bigstamp" id="stamp2"><div class="inner">월급 인상</div></div>
    <div class="hud" id="fade"></div>
    <div class="hud" id="vignette"></div>
    <div class="hud" id="flash"></div>
    <div class="hud" id="help">
      <b>조작법</b><br />
      이동 WASD · 달리기 Shift · 점프 Space<br />
      시점 마우스 · 도장 던지기 클릭 · 필살기 Q<br />
      경비원 인사 E · 소리 M (<span id="muteState">켜짐</span>) · 일시정지 Esc
    </div>
    <div id="touch">
      <div id="stick"><div id="knob"></div></div>
      <button id="spBtn" type="button">필살기</button>
      <button id="jumpBtn" type="button">점프</button>
      <button id="fire" type="button">도장</button>
      <button id="muteBtn" class="mini" type="button">소리 켬</button>
      <button id="pauseBtn" class="mini" type="button">II</button>
    </div>
    <div id="overlay"></div>
    <div id="rotate">
      <div style="font-size: 56px">📱↻</div>
      <div>가로로 돌려주세요</div>
    </div>
    <script type="module" src="/src/fps/main.ts"></script>
  </body>
</html>
