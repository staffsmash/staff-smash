<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <!-- 홈 화면 앱(Three Party Problem)의 첫 화면 = manifest의 start_url. 2D(./)와 1인칭(./fps.html) 중 고른다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Three Party" />
    <meta name="theme-color" content="#002c52" />
    <title>Three Party Problem</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #002c52;
        color: #fff;
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      body {
        background: radial-gradient(120% 90% at 50% 30%, #0b4274 0%, #002c52 60%, #001d38 100%) fixed;
        overflow: hidden;
      }
      main {
        box-sizing: border-box;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(10px, 3.2vh, 28px);
        padding: calc(16px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
          calc(16px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
        text-align: center;
      }
      .sig {
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0.95;
      }
      .sig img {
        display: block;
        height: clamp(28px, 7vh, 52px);
      }
      .sig img.type {
        height: clamp(18px, 4.6vh, 34px);
      }
      h1 {
        margin: 0;
        font-size: clamp(30px, min(8vw, 12vh), 64px);
        line-height: 1.1;
        font-weight: 900;
        letter-spacing: 0.01em;
        text-shadow: 0 3px 0 rgba(0, 0, 0, 0.25);
      }
      h1::after {
        content: '';
        display: block;
        width: 2.4em;
        height: 0.12em;
        margin: 0.22em auto 0;
        border-radius: 2px;
        background: #e0bb62;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: clamp(12px, 3vw, 28px);
        width: 100%;
      }
      nav a {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        /* 가로 화면: 두 단추를 나란히 (좁은 휴대폰 가로에서도 줄바꿈 없이) */
        width: min(300px, calc(50% - 14px));
        min-height: clamp(60px, 17vh, 96px);
        padding: 10px 18px;
        border: 3px solid #e0bb62;
        border-radius: 14px;
        background: rgba(0, 29, 56, 0.55);
        color: #fff;
        font-size: clamp(20px, min(5vw, 6.5vh), 30px);
        font-weight: 800;
        text-decoration: none;
        box-shadow: 0 4px 0 #b8913c, 0 8px 18px rgba(0, 0, 0, 0.3);
        transition: transform 0.08s, background 0.12s, color 0.12s;
      }
      nav a:hover,
      nav a:focus-visible {
        background: #e0bb62;
        color: #002c52;
        outline: none;
      }
      nav a:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #b8913c, 0 4px 10px rgba(0, 0, 0, 0.3);
        background: #e0bb62;
        color: #002c52;
      }
      /* 세로 화면: 단추를 위아래로 */
      @media (orientation: portrait) {
        nav {
          flex-direction: column;
          align-items: center;
        }
        nav a {
          width: min(340px, 100%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="sig">
        <img src="/hufs/emblem-mono.png" alt="" />
        <img class="type" src="/hufs/hufs-type.png" alt="HUFS" />
      </div>
      <h1>Three Party Problem</h1>
      <nav>
        <a href="./">2D 게임</a>
        <a href="./fps.html">1인칭 게임</a>
      </nav>
    </main>
  </body>
</html>
